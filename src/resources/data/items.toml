# [KEY]
# name: [str, str] # ["Singular Name", "Plural Name"]
# description: str
# I default to using the Scarlet/Violet values when possible, otherwise the latest gen game since
#
# pocket_id: int (default: 0)
# 0:Items, 1:Medicine, 2:Poké Balls, 3:TMs & HMs, 4:Berries, 5:Mail, 6:Battle Items, 7:Key Items
#
# price: int (default: 0)
# Buy price. Sell price will be half this value. A value of 0 means the item cannot be sold
# I know SV uses quarter pricing. I don't care.
#
# can_hold: bool (default: true, false if pocket_id=7)
# Whether the item can be held by a Pokémon
#
# can_use_held: bool (default: false)
# Whether the item can be used by a Pokémon while held
#
# use_flags: list (default: [])
# - "IN_BATTLE": Only during battle
# - "OVERWORLD": Only outside of battle
# - "OUTSIDE": Only outside of buildings
# - "IN_CAVE_OR_DUNGEON": Only inside caves or dungeons
# 
# use_type: str (default: "NONE")
# "DIRECT":Use directly
# "ON_POKEMON":Select a Pokémon in your party to use it on
# "ON_FAINTED_POKEMON":Select a fainted Pokémon in your party to use it on
# "ON_POKEMON_MOVE":Use on a Pokémon's move
# "NONE":Cannot be used
#
# fling: int (default: 0)
# Fling damage. A value of 0 will cause Fling to fail
#
# fossil_species: str (default: "")
# The species this fossil should revive into
#
# callback: list[Any] (default: ["nop"])
# Item callback. First item is the callback name, extra items are function arguments.

[MASTERBALL]
